      }
    }
    @media (max-width:560px) { .sc-task-view { padding:14px; } .sc-task-view__header { flex-direction:column; } .sc-task-view__project-mcps, .sc-task-view__header-controls { position:static; align-self:flex-start; max-width:100%; } .sc-task-view__header-controls { align-self:flex-end; } .sc-task-view summary { flex-direction:column; gap:3px; } .sc-task-view__project-mcps > summary { flex-direction:row; } .sc-task-view__role-state { text-align:left; } .sc-task-view__workspace { display:flex; flex-direction:column; gap:0; } .sc-task-view__role-lane, .sc-task-view__roles { width:100%; } .sc-task-view__connector { flex:none; height:24px; min-height:24px; } .sc-task-view__role-preview, .sc-task-view__preview-link { display:none; } .sc-task-view details[data-sc-role] > [data-sc-detail-body] { display:block; } }
    @media (prefers-reduced-motion:reduce) { .sc-task-view *, .sc-task-view *::before, .sc-task-view *::after { animation:none !important; transition:none !important; } }
  </style>
  <header class="sc-task-view__header">

  <section class="sc-task-view__node sc-task-view__task-summary" aria-label="任务总结">
    <h3>任务总结</h3><p data-sc-task-summary>暂无总结</p>
  </section>
  <script>
    "use strict";
    (() => {
      const commonStates={completed:["已完成","completed"],complete:["已完成","completed"],done:["已完成","completed"],success:["已完成","completed"],successful:["已完成","completed"],succeeded:["已完成","completed"],failed:["失败","danger"],paused:["已暂停","waiting"],waiting:["等待中","waiting"],cancelled:["已取消","pending"],canceled:["已取消","pending"],needs_user_confirm:["等待用户确认","waiting"],needs_revision:["需要修订","revision"],blocked:["已阻断","danger"]};
      const taskStates={...commonStates,confirmed:["已确认","completed"],planned:["计划","pending"],dev_in_progress:["开发中","active"],ready_for_cr:["审查阶段","waiting"],cr_blocked:["审查阻断","danger"],ready_for_qa:["测试阶段","waiting"],qa_failed:["测试失败","danger"],qa_conditional:["测试条件通过","revision"],qa_passed:["测试通过","passed"],workflow_ready:["任务完成","passed"],needs_revalidation:["需要重新验证","revision"]};
      const roles=["req","dev","cr","qa"],roleLabels={req:"REQ",dev:"DEV",cr:"CR",qa:"QA"};
      const stoppedStates=new Set(["needs_user_confirm","paused","waiting","blocked","qa_passed","workflow_ready","completed","complete","done","success","successful","succeeded","failed","cancelled","canceled"]);

      const toneClass=(states,value)=>`sc-task-view__state--${typeof value==="string"&&Object.hasOwn(states,value)?states[value][1]:"unknown"}`;
      const stateClass=value=>toneClass(taskStates,value);
      const normalizedStatus=value=>safeText(value).trim().toLowerCase().replace(/[ -]+/g,"_");
      const subskillStates={...commonStates,pending:["待开始","pending"],not_started:["待开始","pending"],running:["进行中","active"],preparing:["进行中","active"],in_progress:["进行中","active"],working:["进行中","active"],active:["进行中","active"],started:["进行中","active"],started_working:["进行中","active"],passed:["已通过","passed"],qa_passed:["已通过","passed"],qa_success:["已通过","passed"],workflow_ready:["已通过","passed"],skipped:["已跳过","pending"],waiting_user:["等待用户确认","waiting"]};
      const roleStates={pending:{label:"待开始",tone:"pending"},running:{label:"进行中",tone:"active"},passed:{label:"通过",tone:"passed"},blocked:{label:"阻断",tone:"danger"},needs_user_confirm:{label:"待用户确认",tone:"waiting"}};
      const roleStatus=value=>typeof value==="string"&&Object.hasOwn(roleStates,value)?roleStates[value]:{label:missing(value)?"状态未提供":"未知状态",tone:"unknown"};
      const subskillStatusText=value=>missing(value)?"状态未提供":Object.hasOwn(subskillStates,normalizedStatus(value))?subskillStates[normalizedStatus(value)][0]:"未知状态";
      const subskillStatusClass=value=>toneClass(subskillStates,normalizedStatus(value));
      const optionalText=value=>typeof value==="string"?value.trim():"";
      const validMetric=value=>Number.isSafeInteger(value)&&value>=0;
      function formatElapsed(value) {
        if (!validMetric(value)) return "未提供";
        if (value<1000) return `${value}毫秒`;
        let seconds=Math.floor(value/1000);
        const days=Math.floor(seconds/86400); seconds%=86400;
        const hours=Math.floor(seconds/3600); seconds%=3600;
        const minutes=Math.floor(seconds/60); seconds%=60;
        const pad=value=>String(value).padStart(2,"0");
        if (days) return `${days}天 ${pad(hours)}小时 ${pad(minutes)}分 ${pad(seconds)}秒`;
        if (hours) return `${hours}小时 ${pad(minutes)}分 ${pad(seconds)}秒`;

      }
      function setMetric(node,value,format) {

      }
      const finishedStatuses=new Set(["completed","complete","done","success","successful","succeeded","passed","qa_passed","qa_success","workflow_ready","failed","cancelled","canceled","skipped"]);

      }
      const projectMcpName=value=>{ const name=optionalText(value).toLowerCase(); return /^[a-z][a-z0-9._-]{0,63}$/.test(name)?name:""; };
      function renderProjectMcps(root,work) {
        const mcps=[...new Set(asList(work.project_mcps).map(projectMcpName).filter(Boolean))];
        const section=root.querySelector("[data-sc-project-mcps]"),count=root.querySelector("[data-sc-project-mcp-count]"),list=root.querySelector("[data-sc-project-mcp-list]");

        root.__scSummaryInPreview=finishedStatuses.has(normalizedStatus(state))&&!selectedRoles.some(role=>asObject(details[role]).status==="running");
        root.querySelector(".sc-task-view__task-summary").classList.toggle("is-preview-summary",root.__scSummaryInPreview);
        bindRolePreview(root);
        renderRoles(root,details,activeRole,openRole,selectedRoles,sameView);
        renderPreviewSize(root);
        renderRolePreview(root,true,sameView);
        const observation=observeHandoff(root.__scHandoffObservation,input,selectedRoles,activeRole);
        root.__scHandoffObservation=observation;
        animateHandoff(root,observation.event);
        root.__scViewId=input.view_id;
        enforceSingleOpen(root);
        bindDetailReveal(root);
        bindAnimationControls(root);
      };
    })();
  </script>
</section>
