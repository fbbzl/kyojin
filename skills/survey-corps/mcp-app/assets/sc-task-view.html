<!--
  Survey Corps MCP App task view. Codex loads this resource in its embedded host.
  Snapshot values are rendered only through textContent.
-->
<section class="sc-task-view" aria-label="SC 任务流程">
  <style>
    .sc-task-view { --bg:#080b10; --panel:#0d1219; --panel-active:#101923; --line:#4b5869; --text:#e8edf3; --muted:#9ba8b8; --focus:#b9e2ff; --pending:#95a3b5; --active:#46b8ee; --completed:#27c9b0; --ok:#4bd882; --warn:#e9c85c; --revision:#ec9b4f; --danger:#ed7589; --unknown:#fff; --motion-period:1.8s; box-sizing:border-box; width:min(680px,100%); margin:0 auto; padding:20px; border:2px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:13px/1.6 "Segoe UI Variable","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif; }
    .sc-task-view *, .sc-task-view *::before, .sc-task-view *::after { box-sizing:inherit; }
    .sc-task-view h3, .sc-task-view p { margin:0; }
    .sc-task-view h3 { margin-top:10px; color:var(--muted); font-size:11px; text-transform:uppercase; }
    .sc-task-view .sc-task-view__git { min-width:0; color:var(--muted); font-size:11px; text-align:left; overflow-wrap:anywhere; }
    .sc-task-view__header { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:start; gap:8px 12px; padding-bottom:14px; border-bottom:2px solid var(--line); }
    .sc-task-view__topbar { display:grid; grid-column:1/-1; grid-template-columns:minmax(0,1fr) auto; align-items:start; gap:12px; }
    .sc-task-view__project-mcps { grid-column:1; justify-self:start; max-width:100%; border:0; background:transparent; }
    .sc-task-view__project-mcps > summary { display:flex; align-items:center; gap:6px; padding:5px 0; color:var(--muted); font-weight:400; }
    .sc-task-view__project-mcps > summary:hover { color:var(--focus); }
    .sc-task-view__project-mcp-count { color:var(--text); }
    .sc-task-view__project-mcp-list { display:grid; gap:4px; margin:4px 0 0; padding:8px 10px; border:2px solid var(--line); background:var(--panel); list-style:none; }
    .sc-task-view__project-mcp-list li { overflow-wrap:anywhere; }
    .sc-task-view__header-controls { grid-column:2; display:flex; align-items:center; justify-content:flex-end; }
    .sc-task-view__header-controls:has(> button[hidden]) { display:none; }
    .sc-task-view__muted { color:var(--muted); }
    .sc-task-view__status { grid-column:2; justify-self:end; max-width:100%; padding:6px 12px; color:var(--muted); font-size:33.8px; line-height:31.2px; font-weight:700; text-align:center; white-space:nowrap; }
    .sc-task-view__flow { display:flex; flex-direction:column; align-items:stretch; margin-top:18px; }
    .sc-task-view__node { min-width:0; border:2px solid var(--line); border-radius:6px; background:var(--panel); transition:box-shadow 160ms ease,transform 160ms ease; }
    .sc-task-view__root { padding:14px; border-width:2px; }
    .sc-task-view__root { text-align:center; }
    .sc-task-view__target { margin-top:4px !important; overflow-wrap:anywhere; font-size:16px; font-weight:700; }
    .sc-task-view__metadata { display:grid; grid-template-columns:6em minmax(0,1fr); align-items:baseline; column-gap:12px; row-gap:6px; width:min(100%,560px); margin:12px auto 0; text-align:left; }
    .sc-task-view__metadata dt { color:var(--muted); text-align:right; }
    .sc-task-view__metadata dd { min-width:0; margin:0; overflow-wrap:anywhere; }
    .sc-task-view [data-sc-selected-roles] { display:flex; align-items:center; }
    .sc-task-view__selection-step { display:contents; }
    .sc-task-view__selection-role { flex:none; padding:0 6px; border:2px solid var(--line); border-radius:6px; line-height:1.6; }
    .sc-task-view__selection-arrow { position:relative; flex:0 0 22px; height:2px; background:var(--muted); color:var(--muted); font-size:0; line-height:0; }
    .sc-task-view__selection-arrow::after { content:""; position:absolute; right:0; top:50%; width:6px; height:8px; transform:translateY(-50%); background:currentColor; clip-path:polygon(0 0,100% 50%,0 100%,0 75%,50% 50%,0 25%); }
    .sc-task-view.is-running .sc-task-view__selection-arrow::before { content:""; position:absolute; top:0; left:0; width:25%; height:2px; background:linear-gradient(to right,transparent,var(--focus),#fff,transparent); pointer-events:none; animation:sc-preview-flow var(--motion-period) linear infinite; }
    @media (max-width:560px) { .sc-task-view [data-sc-selected-roles] { grid-column:1/-1; } }
    .sc-task-view__role-name { display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 10px; min-width:0; }
    .sc-task-view__role-emoji { position:relative; display:inline-block; font-size:18px; line-height:1.2; transform-origin:50% 75%; }
    @media (prefers-reduced-motion:no-preference) {
    .sc-task-view.is-running details.is-active .sc-task-view__role-emoji { animation:sc-fire-flicker var(--emoji-period) ease-in-out var(--emoji-delay) infinite; }
    .sc-task-view.is-running details.is-active .sc-task-view__role-emoji::before { content:""; position:absolute; left:5px; top:3px; width:10px; height:16px; border-radius:70% 30% 60% 40%; background:linear-gradient(0deg,#fff3b0,#ffb52e 45%,#f76b20 85%); clip-path:polygon(50% 0,68% 37%,85% 24%,100% 71%,77% 100%,24% 100%,0 72%,21% 43%,30% 63%); transform-origin:50% 100%; pointer-events:none; animation:sc-flame-tongue var(--emoji-period) ease-in-out var(--emoji-delay) infinite; }
    .sc-task-view.is-running details.is-active .sc-task-view__role-emoji::after { content:""; position:absolute; left:10px; top:3px; width:2px; height:3px; border-radius:50%; background:#ffd36a; box-shadow:4px 5px #ff922e,-3px 8px #ffe7a0; pointer-events:none; animation:sc-fire-sparks var(--emoji-period) linear var(--emoji-delay) infinite; }
    }
    .sc-task-view.has-waiting-motion .sc-task-view__role-emoji.is-awaiting-user { transform-origin:center; animation:sc-hourglass-flip var(--emoji-period) ease-in-out var(--emoji-delay) infinite; }
    .sc-task-view.has-blocked-motion .sc-task-view__role-emoji.is-blocked-ghost { animation:sc-ghost-float var(--emoji-period) ease-in-out var(--emoji-delay) infinite; }
    @media (prefers-reduced-motion:no-preference) { .sc-task-view.has-blocked-motion .sc-task-view__role-emoji.is-blocked-ghost::before { content:""; position:absolute; left:10px; top:11px; width:4px; height:7px; border-radius:1px 1px 3px 3px; background:#f48ba7; transform-origin:50% 0; pointer-events:none; animation:sc-ghost-tongue var(--emoji-period) ease-in-out var(--emoji-delay) infinite; } }
    .sc-task-view.has-blocked-motion .sc-task-view__role-emoji.is-blocked-bug { animation:sc-bug-crawl var(--emoji-period) ease-in-out var(--emoji-delay) infinite; }
    @media (prefers-reduced-motion:no-preference) {
    .sc-task-view details[data-sc-role="req"] { --emoji-period:2.4s; --emoji-delay:-.3s; }
    .sc-task-view details[data-sc-role="dev"] { --emoji-period:2.9s; --emoji-delay:-1.1s; }
    .sc-task-view details[data-sc-role="cr"] { --emoji-period:3.4s; --emoji-delay:-2s; }
    .sc-task-view details[data-sc-role="qa"] { --emoji-period:3.9s; --emoji-delay:-2.8s; }
    .sc-task-view__role-emoji.is-celebrating { animation:sc-role-celebrate var(--emoji-period) ease-out var(--emoji-delay) infinite; }
    .sc-task-view__role-emoji.is-celebrating::before, .sc-task-view__role-emoji.is-celebrating::after { --burst-x:-10%; --burst-angle:14deg; content:""; position:absolute; left:50%; top:30%; width:18px; height:18px; pointer-events:none; opacity:0; background:linear-gradient(var(--warn),var(--warn)) 1px 1px/2px 5px no-repeat,linear-gradient(var(--ok),var(--ok)) 8px 0/2px 4px no-repeat,linear-gradient(var(--danger),var(--danger)) 15px 4px/2px 5px no-repeat; animation:sc-confetti-burst var(--emoji-period) ease-out var(--emoji-delay) infinite; }
    .sc-task-view__role-emoji.is-celebrating::after { --burst-x:-40%; --burst-angle:-12deg; background:linear-gradient(var(--focus),var(--focus)) 2px 9px/4px 2px no-repeat,linear-gradient(var(--danger),var(--danger)) 10px 14px/2px 4px no-repeat,linear-gradient(var(--ok),var(--ok)) 14px 10px/4px 2px no-repeat; }
    }
    .sc-task-view__summary-content { margin-top:0; }
    .sc-task-view .sc-task-view__summary-title { margin:0 0 8px; color:var(--text); font-size:13px; }
    .sc-task-view__summary-content > section + section { margin-top:12px; }
    .sc-task-view__summary-content h4 { margin:0; color:var(--muted); font-size:11px; }
    .sc-task-view__summary-content p, .sc-task-view__summary-content ul { margin:4px 0 0; }
    .sc-task-view__summary-content ul { padding-left:18px; }
    .sc-task-view [hidden] { display:none !important; }
    .sc-task-view__connector { position:relative; flex:0 0 36px; width:12px; min-height:36px; margin:0 auto; color:var(--muted); transform-origin:top; }
    .sc-task-view__connector::before { content:""; position:absolute; top:0; left:50%; width:2px; height:calc(100% - 9px); transform:translateX(-50%); background:currentColor; box-shadow:0 0 4px color-mix(in srgb,currentColor 35%,transparent); }
    .sc-task-view__connector::after { content:""; position:absolute; left:50%; bottom:3px; width:0; height:0; transform:translateX(-50%); border-left:4px solid transparent; border-right:4px solid transparent; border-top:7px solid currentColor; }
    .sc-task-view__connector.has-files { display:flex; flex-direction:column; justify-content:center; flex-basis:auto; width:100%; height:auto; padding:12px 0 18px; }
    .sc-task-view__connector-files { position:relative; z-index:1; display:grid; gap:4px; min-width:0; width:100%; padding:4px 0; background:var(--bg); color:var(--muted); font-size:11px; line-height:1.4; text-align:center; }
    .sc-task-view__connector-file { min-width:0; padding:1px 4px; overflow:hidden; border:2px solid var(--line); border-radius:4px; background:var(--panel); text-overflow:ellipsis; white-space:nowrap; }
    .sc-task-view__connector.is-handoff-flow { color:var(--active); }
    .sc-task-view__connector.is-handoff-flow::before { background-color:currentColor; background-image:linear-gradient(transparent 30%,var(--focus) 48%,transparent 66%); background-size:100% 300%; animation:sc-handoff-flow 650ms ease-in-out 1 both; }
    .sc-task-view__connector.is-handoff-reverse::before { animation-direction:reverse; }
    .sc-task-view__connector.is-handoff-reverse::after { top:0; bottom:auto; border-top:0; border-bottom:7px solid currentColor; }
    .sc-task-view__workspace { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,3fr); gap:12px; align-items:start; padding-top:20px; padding-left:8px; }
    .sc-task-view__role-lane { position:relative; display:flex; align-self:start; min-width:0; }
    .sc-task-view__role-lane:has(.sc-task-view__connector) { align-self:stretch; }
    .sc-task-view__role-lane:has(.sc-task-view__connector) .sc-task-view__connector { flex-grow:1; }
    .sc-task-view__lane-frame { position:absolute; left:-8px; top:-8px; width:calc(100% + 16px); height:calc(100% + 16px); pointer-events:none; }
    .sc-task-view__lane-frame rect { x:1px; y:1px; width:calc(100% - 2px); height:calc(100% - 2px); rx:12px; fill:none; stroke:color-mix(in srgb,var(--line) 70%,transparent); stroke-width:2px; stroke-dasharray:6px 6px; }
    .sc-task-view.is-running .sc-task-view__lane-frame rect { animation:sc-lane-flow 1.2s linear infinite; }
    .sc-task-view__roles { position:relative; display:flex; flex:1; flex-direction:column; align-items:stretch; }
    .sc-task-view__role-preview { display:grid; grid-template-rows:auto minmax(0,1fr); align-self:stretch; justify-self:end; width:calc(90% + 27px); min-width:0; padding:14px; border:2px solid var(--line); border-radius:6px; background:var(--panel); }
    .sc-task-view__preview-content { display:grid; min-width:0; overflow-wrap:anywhere; }
    .sc-task-view__file-activity { align-self:start; box-sizing:content-box; min-width:0; height:22px; margin-bottom:10px; border:2px solid var(--line); border-radius:6px; overflow:hidden; font-size:11px; line-height:11px; }
    .sc-task-view__file-activity[aria-hidden="true"] { visibility:hidden; }
    .sc-task-view__file-track { min-width:0; transform:translateY(-5.5px); }
    .sc-task-view__file-track.is-file-switching { animation:sc-file-switch 220ms ease-out 1; }
    .sc-task-view__file-slot { height:11px; overflow-x:auto; overflow-y:hidden; white-space:nowrap; scrollbar-width:none; color:var(--muted); }
    .sc-task-view__file-slot:nth-child(2) { color:var(--text); }
    .sc-task-view [data-sc-role] .sc-task-view__file-activity { display:none; }
    @media (max-width:560px) { .sc-task-view [data-sc-role] .sc-task-view__file-activity { display:block; margin-bottom:0; } }
    @keyframes sc-file-switch { from { transform:translateY(5.5px); } to { transform:translateY(-5.5px); } }
    .sc-task-view__preview-content .sc-task-view__detail { display:grid; align-content:start; gap:24px; padding:20px 0; border-top:0; }
    .sc-task-view__preview-body { display:grid; grid-area:1/1; align-self:stretch; min-width:0; }
    .sc-task-view__preview-size { display:grid; grid-area:1/1; align-self:start; min-width:0; visibility:hidden; pointer-events:none; user-select:none; }
    .sc-task-view__preview-size > * { grid-area:1/1; align-self:start; min-width:0; }
    .sc-task-view__preview-summary { display:none; }
    .sc-task-view__preview-summary { grid-area:1/1; align-self:start; min-width:0; }
    .sc-task-view__role-preview.is-showing-summary .sc-task-view__preview-summary { display:block; }
    /* Completed previews share one size model; scaled borders must not need pixel compensation. */
    .sc-task-view.is-finished .sc-task-view__role-preview { grid-template-rows:minmax(0,1fr); }
    .sc-task-view.is-finished .sc-task-view__role-preview > .sc-task-view__file-activity { display:none; }
    .sc-task-view__role-preview.is-showing-summary .sc-task-view__preview-body { display:none; }
    .sc-task-view__preview-body:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
    .sc-task-view__preview-empty { color:var(--muted); }
    .sc-task-view details { min-width:0; border:2px solid var(--line); border-radius:6px; background:var(--panel); transition:border-color 160ms ease,background-color 160ms ease,box-shadow 160ms ease; }
    .sc-task-view details[data-sc-role]:hover { box-shadow:0 3px 12px color-mix(in srgb,#000 28%,transparent); }
    .sc-task-view details[data-sc-role] { position:relative; width:100%; border-width:2px; border-color:var(--line); }
    .sc-task-view details[data-sc-role] > [data-sc-detail-body] { display:none; }
    .sc-task-view details[data-sc-role="req"].is-active { --role-accent:#bd9bea; }
    .sc-task-view details[data-sc-role="dev"].is-active { --role-accent:#4bd882; }
    .sc-task-view details[data-sc-role="cr"].is-active { --role-accent:#e9c85c; }
    .sc-task-view details[data-sc-role="qa"].is-active { --role-accent:#ed7589; }
    .sc-task-view details[data-sc-role].is-active { border-color:var(--role-accent); background:var(--panel-active); animation:sc-running-pulse var(--motion-period) ease-in-out infinite; }
    .sc-task-view details[data-sc-role].is-active > * { position:relative; z-index:1; }
    .sc-task-view details[data-sc-role] > summary { position:relative; }
    .sc-task-view details[data-sc-role] > summary::before { content:""; position:absolute; z-index:3; top:5px; bottom:5px; left:0; border-left:2px solid var(--active); pointer-events:none; }
    /* Clip the transient fill separately so the ownership line can extend beyond its summary. */
    .sc-task-view__role-ripple-clip { position:absolute; z-index:2; inset:0; overflow:hidden; border-radius:inherit; pointer-events:none; }
    .sc-task-view__role-ripple { position:absolute; border-radius:50%; background:var(--focus); pointer-events:none; animation:sc-role-ripple 500ms ease-out 1 both; }
    @keyframes sc-role-ripple { from { opacity:.24; transform:translate(-50%,-50%) scale(0); } to { opacity:0; transform:translate(-50%,-50%) scale(1); } }
    /* Expanding the right-aligned preview 27px left shortens its gap; summary excludes two 2px borders. */
    .sc-task-view__preview-link { position:absolute; left:calc(100% + 2px); top:50%; width:calc(12px + 30% + 1.2px - 27px); height:2px; background:var(--focus); box-shadow:0 0 4px color-mix(in srgb,var(--focus) 45%,transparent); pointer-events:none; }
    .sc-task-view__preview-link:not([hidden])::before { content:""; position:absolute; top:-.5px; left:0; width:25%; height:3px; border-radius:2px; background:linear-gradient(to right,transparent,var(--focus) 35%,#fff 55%,transparent); box-shadow:0 0 6px 1px color-mix(in srgb,var(--focus) 55%,transparent); opacity:0; animation:sc-preview-flow var(--motion-period) linear infinite; }
    .sc-task-view details[data-sc-role].is-handoff-receiving::after { content:""; position:absolute; inset:-2px; border:2px solid var(--focus); border-radius:inherit; pointer-events:none; animation:sc-handoff-receive 420ms ease-out 650ms 1 both; }
    .sc-task-view summary { display:flex; justify-content:space-between; gap:12px; padding:11px 12px; border-radius:5px; cursor:pointer; font-weight:700; list-style-position:inside; overflow-wrap:anywhere; transition:background-color 160ms ease; }
    .sc-task-view summary:hover { background:color-mix(in srgb,var(--focus) 7%,transparent); }
    .sc-task-view summary:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
    .sc-task-view details[data-sc-role] > summary { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,2fr); align-items:stretch; gap:0; min-height:calc(3.2em + 18px); padding:5px 3px; text-align:center; }
    .sc-task-view details[data-sc-role] .sc-task-view__role-name { justify-content:center; align-items:center; padding-right:6px; border-right:2px solid var(--line); }
    .sc-task-view__role-progress { display:grid; align-content:start; gap:3px; min-width:0; padding-left:6px; text-align:left; }
    .sc-task-view details[data-sc-role] > summary .sc-task-view__role-state { min-width:0; max-width:100%; text-align:left; white-space:normal; }
    .sc-task-view__role-elapsed, .sc-task-view__role-subskill { min-width:0; color:var(--muted); font-size:11px; font-weight:400; overflow-wrap:anywhere; }
    .sc-task-view__role-subskill { min-height:1.6em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sc-task-view__role-state { color:var(--muted); font-weight:400; text-align:right; }
    .sc-task-view .sc-task-view__state--pending { color:var(--pending); }
    .sc-task-view .sc-task-view__state--active { color:var(--active); }
    .sc-task-view .sc-task-view__state--completed { color:var(--completed); }
    .sc-task-view .sc-task-view__state--passed { color:var(--ok); }
    .sc-task-view .sc-task-view__state--danger { color:var(--danger); }
    .sc-task-view .sc-task-view__state--waiting { color:var(--warn); }
    .sc-task-view .sc-task-view__state--revision { color:var(--revision); }
    .sc-task-view .sc-task-view__state--unknown { color:var(--unknown); }
    .sc-task-view .sc-task-view__placeholder { color:#fff; }
    .sc-task-view__detail { display:grid; gap:16px; padding:12px 0; border-top:2px solid #273241; }
    .sc-task-view__detail-field, .sc-task-view__summary-content > section { min-width:0; padding:10px 12px; border:2px solid var(--line); border-radius:6px; }
    .sc-task-view .sc-task-view__detail-field > h3 { margin:0 0 8px; font-size:13px; }
    .sc-task-view__detail-content:empty { min-height:1.6em; min-height:1lh; }
    .sc-task-view [data-sc-detail-body].is-detail-revealing { animation:sc-detail-reveal 180ms ease-out 1; }
    .sc-task-view [data-sc-preview-body].is-detail-revealing { animation:sc-preview-reveal 180ms ease-out 1; }
    .sc-task-view__detail ul { margin:5px 0 0; padding-left:18px; }
    .sc-task-view__detail li, .sc-task-view__detail p { overflow-wrap:anywhere; }
    .sc-task-view__empty { color:#fff; font-style:italic; }
    .sc-task-view__play { padding:5px 9px; border:2px solid var(--line); border-radius:5px; background:var(--panel); color:var(--text); font:inherit; cursor:pointer; transition:background-color 160ms ease; }
    .sc-task-view__play:hover { border-color:var(--focus); color:var(--focus); }
    .sc-task-view__play:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
    .sc-task-view details.sc-task-view__node.is-manual-replay { animation:sc-manual-role 1.1s ease-in-out 2; }
    @keyframes sc-manual-role { 0%,100% { box-shadow:0 0 0 0 transparent; } 50% { box-shadow:0 0 0 6px color-mix(in srgb,var(--focus) 32%,transparent); } }
    @keyframes sc-running-pulse { 0%,100% { background-color:color-mix(in srgb,var(--role-accent) 3%,var(--panel-active)); box-shadow:0 0 0 1px color-mix(in srgb,var(--role-accent) 26%,transparent),0 0 8px color-mix(in srgb,var(--role-accent) 18%,transparent); } 50% { background-color:color-mix(in srgb,var(--role-accent) 8%,var(--panel-active)); box-shadow:0 0 0 5px color-mix(in srgb,var(--role-accent) 52%,transparent),0 0 26px color-mix(in srgb,var(--role-accent) 38%,transparent); } }
    @keyframes sc-handoff-flow { 0% { background-position:50% 100%; opacity:.5; } 35%,65% { opacity:1; } 100% { background-position:50% 0%; opacity:.5; } }
    @keyframes sc-handoff-receive { 0% { opacity:0; box-shadow:0 0 0 transparent; } 25% { opacity:1; box-shadow:0 0 18px color-mix(in srgb,var(--focus) 55%,transparent); } 100% { opacity:0; box-shadow:0 0 0 transparent; } }
    @keyframes sc-detail-reveal { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
    @keyframes sc-preview-reveal { from { opacity:0; } to { opacity:1; } }
